name: Deploy Frontend to S3 and CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  AWS_ROLE_ARN: arn:aws:iam::137192580656:role/supply-risk-github-frontend-deploy-role
  S3_BUCKET: supply-risk-frontend-137192580656-ap-northeast-2-an
  CLOUDFRONT_DISTRIBUTION_ID: EKDLK3C0COU4Y
  VITE_API_BASE_URL: https://d2qeq07s1pqlri.cloudfront.net

jobs:
  build-and-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload build files to S3
        run: |
          aws s3 sync ./dist "s3://${S3_BUCKET}" \
            --delete \
            --region "${AWS_REGION}"

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)

          echo "CloudFront invalidation: ${INVALIDATION_ID}"

          aws cloudfront wait invalidation-completed \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --id "${INVALIDATION_ID}"

      - name: Deployment summary
        run: |
          echo "Frontend deployment completed."
          echo "URL: https://d2qeq07s1pqlri.cloudfront.net"